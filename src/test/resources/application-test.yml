spring:
  datasource:
    url: jdbc:h2:mem:orion_iam_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    open-in-view: false

orion:
  security:
    jwt:
      secret: test-secret-key-for-unit-tests-only-min-256-bits-padding
      expiration-ms: 3600000
